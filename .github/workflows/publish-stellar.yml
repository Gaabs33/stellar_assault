name: Publish Stellar Assault

on:
  push:
    paths:
      - ".publish/part06.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          cat .publish/part*.b64 > /tmp/stellar.b64
          base64 -d /tmp/stellar.b64 > /tmp/stellar.zip
          echo "e98069db8b9df2096c169d84b2d66cf00ca0b074773dbd27dc15309182aaaab1  /tmp/stellar.zip" | sha256sum -c -
          unzip -o /tmp/stellar.zip -d .
          rm -rf .publish .bootstrap

      - name: Commit published project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish Stellar Assault project"
            git push
          fi
